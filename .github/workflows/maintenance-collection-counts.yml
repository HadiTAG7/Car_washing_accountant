# ═══════════════════════════════════════════════════════════════════════════
# صيانة — عدد المستندات في كل مجموعة (قراءة فقط)
# ═══════════════════════════════════════════════════════════════════════════
# يطبع أحجام المجموعات بـ count() — أرقاماً بلا بيانات — لبناء بيانات تجريبية
# بحجم الإنتاج على المحاكي. التكلفة: قراءة لكل 1000 مستند في كل مجموعة.
# بلا مدخلات: لا شيء من المستخدم يدخل الأمر.
# ═══════════════════════════════════════════════════════════════════════════

name: صيانة — أحجام المجموعات (قراءة فقط)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: العدّ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: التحقق من وجود السرّ
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::السر FIREBASE_SERVICE_ACCOUNT غير مضبوط. الخطوات في docs/DEPLOY.md."
            exit 1
          fi

      - name: كتابة المفتاح في ملف مؤقت
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: التشغيل
        run: node scripts/collection-counts.mjs --json | tee "$RUNNER_TEMP/out.json"

      - name: الخلاصة
        if: always()
        run: |
          {
            echo '### أحجام المجموعات'
            echo '```json'
            cat "$RUNNER_TEMP/out.json" 2>/dev/null || echo 'لا مخرجات.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: محو المفتاح
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
