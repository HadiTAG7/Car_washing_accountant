# ═══════════════════════════════════════════════════════════════════════════
# صيانة البيانات — استبدالٌ جماعي في أسماء مصاريف التأسيس
# ═══════════════════════════════════════════════════════════════════════════
# يعمل **يدوياً فقط**، و**معاينةً افتراضياً**: بلا تفعيل `apply` لا يُكتب حرف،
# ويُطبع ما سيتغيّر بالضبط. تغييرُ بياناتٍ محاسبية قرار، والقرار يُتّخذ على
# قائمةٍ مقروءة لا على وصفٍ لها.
#
# السكربت لا يكتب في Firestore بنفسه — يستدعي `updateStartupEntry`، نفس دالة
# الخادم التي يستدعيها التطبيق. فالمبلغ والتاريخ لا يتغيّران بعد الترحيل، ونصّ
# القيد المُرحّل يُبدَّل مع الوصف في نفس المعاملة، والفترة المقفلة تُرفض،
# ويُكتب سجل تدقيق لكل صف.
#
# المفتاح هو نفسه سرّ النشر `FIREBASE_SERVICE_ACCOUNT` — يُكتب في ملف مؤقت
# داخل المشغّل، ويُمحى في كل الأحوال، ولا يُطبع في أي سجل.
# ═══════════════════════════════════════════════════════════════════════════

name: صيانة — استبدال في أسماء المصاريف

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'النص القديم (يُطابَق رغم ة/ه و أ/ا والحركات)'
        required: true
        type: string
      to:
        description: 'النص الجديد'
        required: true
        type: string
      unit:
        description: 'التقسيم الذي يُسنَد مع الاسم — اتركه فارغاً لتغيير الاسم وحده'
        required: false
        default: ''
        type: string
      apply:
        description: 'اكتب فعلاً (بلا تفعيله: معاينة فقط)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# كتابتان متزامنتان على نفس المجموعة تتسابقان.
concurrency:
  group: data-maintenance
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.apply && 'تطبيق' || 'معاينة' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: التحقق من وجود السرّ
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::السر FIREBASE_SERVICE_ACCOUNT غير مضبوط. الخطوات في docs/DEPLOY.md."
            exit 1
          fi

      - name: كتابة المفتاح في ملف مؤقت
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: التشغيل
        env:
          MAINT_ACTOR: ${{ github.actor }}
        run: |
          node scripts/rename-startup-entries.mjs \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}" \
            ${{ inputs.unit && format('--unit "{0}"', inputs.unit) || '' }} \
            ${{ inputs.apply && '--apply' || '' }} \
            | tee "$RUNNER_TEMP/out.txt"

      - name: الخلاصة
        if: always()
        run: |
          {
            echo '### نتيجة الصيانة'
            echo '```'
            cat "$RUNNER_TEMP/out.txt" 2>/dev/null || echo 'لا مخرجات.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # يُمحى نجح أو فشل.
      - name: محو المفتاح
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
