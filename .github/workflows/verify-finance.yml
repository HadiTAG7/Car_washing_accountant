name: Verify finance review

on:
  pull_request:
    paths:
      - .github/workflows/verify-finance.yml
      - functions/src/financeEmployeeAdvance.js
      - functions/src/financeReview.js
      - functions/src/posting.js
      - functions/src/ledger.js
      - functions/src/payroll.js
      - functions/src/payrollPreapproval.js
      - functions/src/payrollRecoveryReconciliation.js
      - server/financeWorkbench.js
      - server/financeReadSnapshot.js
      - firestore.rules
      - supabase/migrations/20261029000000_custody_expense_guard.sql
      - server/__tests__/financeWorkbenchBrowse.test.js
      - server/__tests__/financeWorkflow.emulator.test.js
      - src/components/FinanceExpenseForm.jsx
      - src/lib/accounting/postingRules.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix mcp
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:finance:emulator

  # One-run attribution check. Remove after comparing the current base with
  # the unrelated legacy server/callable failures seen on this PR.
  baseline-server-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix mcp
      - run: npm run test:emulator

  baseline-callable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm ci --prefix mcp
      - run: npm run test:callables
