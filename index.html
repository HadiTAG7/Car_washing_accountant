<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سويتر | نظام إدارة القيود والشركاء</title>
    <!-- PWA: installable on phone home screens. theme-color follows the
         header surface in each scheme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="سويتر" />
    <meta name="description" content="سويتر | Sweater — نظام إدارة القيود المالية والشركاء." />
    <meta name="author" content="شركة هادي الغانم | Hadi Alghanim Company" />
    <meta name="application-name" content="سويتر | Sweater" />
    <!-- Sweater Design System typefaces, self-hosted under
         /fonts/sweater/. Preload the faces the first paint needs: the
         Arabic UI text and the Latin numerals. -->
    <link rel="preload" href="/fonts/sweater/ibm-plex-sans-arabic400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sweater/ibm-plex-sans-arabic600-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/sweater/inter600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Dark-mode no-flash: set the `.dark` class on <html> synchronously
         from localStorage (falls back to system preference) BEFORE React
         mounts so the first paint matches the saved theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mw:darkMode');
          var prefersDark = stored == null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'true';
          var root = document.documentElement;
          if (prefersDark) root.classList.add('dark');
          root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } catch (e) { /* localStorage blocked or matchMedia missing */ }
      })();
    </script>
  </head>
  <body>
    <style>
      #sw-boot { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--sw-bg,#0b0b0b); color:var(--sw-text,#fff); font-family:system-ui,sans-serif; }
      #sw-recovery { position:fixed; z-index:2147483647; bottom:12px; inset-inline:12px; max-width:540px; margin-inline:auto; max-height:calc(100dvh - 24px); overflow:auto; box-shadow:0 8px 32px #0006; }
      .sw-recovery-card { box-sizing:border-box; padding:20px; margin:12px; border:1px solid var(--sw-border-subtle,#555); border-radius:16px; background:var(--sw-surface,#272727); color:var(--sw-text,#fff); font:16px/1.7 system-ui,sans-serif; overflow-wrap:anywhere; }
      .sw-recovery-card h2 { font-size:18px; font-weight:700; margin:0 0 8px; }
      .sw-recovery-card p { margin:8px 0; }
      .sw-recovery-card button { cursor:pointer; min-height:44px; padding:8px 14px; margin:6px 4px; border:1px solid #a63c00; border-radius:10px; background:#c84a00; color:#fff; font:inherit; }
      .sw-recovery-card button:focus-visible { outline:3px solid #ffad70; outline-offset:2px; }
      #sw-recovery-diagnostic-text { display:block; box-sizing:border-box; width:100%; min-height:140px; max-height:240px; padding:10px; border:1px solid #777; border-radius:8px; background:var(--sw-surface,#272727); color:inherit; font:12px/1.5 monospace; }
      #sw-recovery[hidden],#sw-recovery-confirm[hidden],#sw-recovery-diagnostic[hidden],#sw-boot[hidden] { display:none; }
    </style>
    <div id="root"><div id="sw-boot" role="status"><p id="sw-boot-message">جارٍ تحميل سويتر… / Loading Sweater…</p></div></div>
    <aside id="sw-recovery" class="sw-recovery-card" role="alert" aria-labelledby="sw-recovery-title" hidden>
      <h2 id="sw-recovery-title"></h2><p id="sw-recovery-message"></p>
      <button id="sw-recovery-dismiss" type="button"></button><button id="sw-recovery-reload" type="button"></button>
      <p id="sw-recovery-reference" dir="ltr"></p>
      <button id="sw-recovery-copy" type="button"></button>
      <div id="sw-recovery-diagnostic" hidden>
        <label id="sw-recovery-diagnostic-label" for="sw-recovery-diagnostic-text"></label>
        <textarea id="sw-recovery-diagnostic-text" dir="ltr" readonly spellcheck="false"></textarea>
        <p id="sw-recovery-copy-status" role="status"></p>
      </div>
      <div id="sw-recovery-confirm" hidden><p id="sw-recovery-warning"></p>
        <button id="sw-recovery-cancel" type="button"></button><button id="sw-recovery-confirm-reload" type="button"></button>
      </div>
    </aside>
    <noscript>يلزم تفعيل JavaScript لعرض سويتر. / Enable JavaScript to use Sweater.</noscript>
    <script src="/app-diagnostics.js"></script>
    <script src="/app-recovery.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
