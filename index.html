<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سويتر | نظام إدارة القيود والشركاء</title>
    <!-- Thmanyah Sans is bundled locally under /fonts/thmanyah/. Preload
         the two most-used weights so the first render doesn't flash an
         unstyled fallback. -->
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Bold.woff2"    as="font" type="font/woff2" crossorigin />
    <!-- Dark-mode no-flash: set the `.dark` class on <html> synchronously
         from localStorage (falls back to system preference) BEFORE React
         mounts so the first paint matches the saved theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mw:darkMode');
          var prefersDark = stored == null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'true';
          if (prefersDark) document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage blocked or matchMedia missing */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
